<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B1D">
<title>Second Brain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#E9EEED; --surface:#F7F9F8; --sunk:#DCE4E3;
  --ink:#12343B; --ink-2:#4E666A; --line:#C3CFCE;
  --signal:#E8B420; --signal-ink:#231C00; --signal-soft:#F6E3A6;
  --rust:#A9412D; --rust-soft:#F3DDD7;
  --stbd:#2B7556; --stbd-soft:#D6EBE1;
  --blue:#2D5E8C;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --paper:#0E1B1D; --surface:#152629; --sunk:#1D3236;
  --ink:#D6E2E0; --ink-2:#8FA6A8; --line:#2B4347;
  --signal:#D9A91C; --signal-ink:#1A1400; --signal-soft:#3B3212;
  --rust:#E08A74; --rust-soft:#3A221D;
  --stbd:#6CC39C; --stbd-soft:#18342A;
  --blue:#86B4E0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--paper)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
header.top{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 18px;border-bottom:1px solid var(--line);user-select:none}
header.top b{font:700 22px/1 var(--cond);font-stretch:condensed;flex:1}
header.top span{font-size:13px;color:var(--ink-2)}
.icobtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:40px;min-height:36px;font-size:17px;cursor:pointer}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:680px;margin:0 auto;padding:16px 18px 32px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
nav.tabs button{appearance:none;border:0;background:none;color:var(--ink-2);font:600 12px/1.1 var(--body);padding:8px 2px 9px;cursor:pointer;border-top:3px solid transparent;display:grid;gap:3px;justify-items:center}
nav.tabs button i{font-style:normal;font-size:19px;line-height:1;filter:grayscale(.6);opacity:.8}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--signal)}
nav.tabs button[aria-current="page"] i{filter:none;opacity:1}
h1{font:700 30px/1.05 var(--cond);font-stretch:condensed;margin:4px 0 6px;overflow-wrap:anywhere}
h2{font:600 19px/1.2 var(--cond);font-stretch:condensed;margin:24px 0 8px}
.eyebrow{font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:2px 0 6px}
.eyebrow.learn{color:var(--signal)} .eyebrow.ref{color:var(--stbd)}
p{margin:0 0 10px}
.muted{color:var(--ink-2)} .small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.green{background:var(--stbd);border-color:var(--stbd);color:var(--paper)}
.btn.warn{color:var(--rust);border-color:var(--rust)}
.btn.link{border:0;background:none;padding:6px 0;min-height:0;color:var(--blue)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
input:not([type=checkbox]):not([type=file]):not([type=radio]),select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--ink);min-height:44px}
textarea{resize:vertical;min-height:130px;line-height:1.45;font-size:15px}
textarea.short{min-height:80px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink-2)}
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--stbd)}

.trow,.hubrow{appearance:none;display:grid;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink)}
.trow{grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 2px}
.trow .t{font-weight:600;font-size:17px}
.trow .m{font-size:13px;color:var(--ink-2)}
.hubrow{grid-template-columns:minmax(0,1fr) 46px 42px 42px;gap:8px;align-items:center;padding:10px 0;font-size:15px}
.hubrow.head{font-size:12px;color:var(--ink-2);font-weight:600;cursor:default}
.hubrow .n{text-align:right;font-variant-numeric:tabular-nums}
.score{font:700 34px/1 var(--cond);font-stretch:condensed;text-align:right;white-space:nowrap}
.score small{font-size:15px;color:var(--ink-2);font-weight:600}
.score.none{color:var(--ink-2);font-size:24px}
.score.low{color:var(--rust)}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.hero .score{font-size:60px}
.trend{font-size:13px;color:var(--ink-2);margin-top:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 100px 3ch;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink)}
.bar .v{text-align:right;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.stats b{display:block;font:700 28px/1 var(--cond)}
.stats span{font-size:13px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel.next{border-left:5px solid var(--signal)}
.panel.due{border-left:5px solid var(--rust);padding:10px 14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor;margin-right:4px;white-space:nowrap}
.badge.r{color:var(--rust)} .badge.s{color:var(--ink-2)} .badge.g{color:var(--stbd)} .badge.y{color:var(--signal)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tg{font-size:13px;font-weight:500;padding:4px 11px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--ink)}
button.tg{cursor:pointer}
button.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
ol.mis,ul.plain{margin:0;padding-left:22px}
ol.mis li,ul.plain li{margin:0 0 10px}
.mis .c{display:block;color:var(--stbd);font-weight:500}
.mis .src{display:block;font-size:13px;color:var(--blue)}
.mis .d{display:block;font-size:13px;color:var(--ink-2)}
.layman{font-size:17px;line-height:1.55;white-space:pre-wrap}
.sendbox{background:var(--signal-soft);border-radius:10px;padding:12px;margin:12px 0}
.sendbox .muted{color:var(--ink)}
.sendbox.ref{background:var(--stbd-soft)}
.imp{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--surface);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.imp.new{border-left-color:var(--stbd)} .imp.upd{border-left-color:var(--signal)} .imp.old{border-left-color:var(--rust)} .imp.note{border-left-color:var(--blue)}
.imp input[type=checkbox]{margin:2px 0 0}
.imp b{display:block}
.imp .k{font-size:13px;color:var(--ink-2)}
.imp select{margin-top:6px;padding:6px 8px}
.notefile{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.notefile .k{font-size:13px;color:var(--ink-2)}
.banner{background:var(--rust-soft);color:var(--rust);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-weight:500}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:15px;max-width:90vw;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.hidden{display:none!important}
.viewer{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer .vh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.viewer .vh b{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe{flex:1;border:0;width:100%;background:#fff}
.viewer .pic{flex:1;display:grid;place-items:center;overflow:auto;background:#000}
.viewer .pic img{max-width:100%;max-height:100%;object-fit:contain}
.lock{position:fixed;inset:0;z-index:40;background:var(--paper);display:grid;place-items:center;padding:24px}
.lock .box{width:min(320px,100%);display:grid;gap:12px;text-align:center}
.lock input{text-align:center;font-size:24px!important;letter-spacing:.3em}

/* references */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.area{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--stbd);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);display:grid;gap:4px;min-height:96px}
.area .ic{font-size:24px;line-height:1}
.area .nm{font:700 20px/1.1 var(--cond);font-stretch:condensed;overflow-wrap:anywhere}
.area .ct{font-size:12px;color:var(--ink-2)}
.area .od{font-size:12px;color:var(--rust);font-weight:600}
.ri{display:grid;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}
.ri.todo{grid-template-columns:auto minmax(0,1fr)}
.ri.contact{grid-template-columns:minmax(0,1fr) auto}
.ri .hit{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);min-width:0;width:100%}
.ri .t{font-weight:600;overflow-wrap:anywhere}
.ri .m{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.ri.done .t{text-decoration:line-through;color:var(--ink-2);font-weight:500}
.ri .od{color:var(--rust);font-weight:700}
.ri .soon{color:var(--signal);font-weight:600}
.fact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:baseline}
.fact .v{font-weight:700;text-align:right;overflow-wrap:anywhere}
.snip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kindadd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kindadd .btn{justify-content:center;padding:8px 2px;font-size:14px;white-space:nowrap}
@media (max-width:380px){.kindadd .btn{font-size:13px}}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:10px 2px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--stbd);color:var(--paper)}
.bigval{font:700 40px/1.05 var(--cond);font-stretch:condensed;margin:6px 0 10px;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:8px 0}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;cursor:pointer}
.qadd{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:8px;margin:6px 0 4px}
@media (max-width:420px){.qadd{grid-template-columns:minmax(0,1fr) auto}.qadd input[type=date]{grid-column:1/2}}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:8px 0 10px}
.acard{appearance:none;display:grid;gap:4px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 8px;cursor:pointer;color:var(--ink);min-width:0}
.athumb{display:block;aspect-ratio:4/3;border-radius:7px;overflow:hidden;background:var(--sunk)}
.athumb img{width:100%;height:100%;object-fit:cover;display:block}
.acap{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding:0 2px}
.acap.empty{color:var(--ink-2);font-weight:500;font-style:italic}
.alab{font-size:12px;color:var(--ink-2);padding:0 2px}
.ftile{position:relative;display:grid;place-items:center;width:100%;height:100%;background:var(--sunk);color:var(--ink);overflow:hidden}
.ftile img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff}
.ftile.doc{align-content:center;gap:2px;padding:6px;text-align:center}
.ftile.doc i{font-style:normal;font-size:30px;line-height:1}
.ftile.doc small{font-size:11px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ftile .fx{position:absolute;left:5px;bottom:5px;font-size:10px;font-weight:700;letter-spacing:.04em;background:var(--rust);color:#fff;border-radius:4px;padding:1px 5px}
.ftile.doc .fx{position:static;justify-self:center}
.capform{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.capform .athumb{aspect-ratio:1}
.viewer .pdfv{flex:1;overflow:auto;background:#525659;padding:8px;display:grid;gap:8px;justify-items:center;align-content:start}
.viewer .pdfv canvas{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);max-width:100%}
.viewer .pdfv p{color:#fff}
.viewer .other{flex:1;display:grid;place-items:center;padding:24px;text-align:center}
.attedit{padding:12px;border-bottom:1px solid var(--line);background:var(--surface);display:grid;gap:10px}
.res-sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:16px 0 4px}
</style>
</head>
<body>
<header class="top"><b id="brand" title="Triple-tap to lock">Second Brain</b><span id="status">Loading…</span><button class="icobtn" id="searchBtn" aria-label="Search everything" title="Search everything">🔍</button></header>
<main id="main"></main>
<nav class="tabs" id="nav"></nav>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<div id="overlay"></div>
<div id="lockbox"></div>

<script>
"use strict";
const APP_VERSION = "1.2.0";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "").trim()); }
function dayDiff(iso) { return Math.round((new Date(iso + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000); }
function daysSince(iso) { if (!isDate(iso)) return null; return Math.max(0, -dayDiff(iso)); }
function slugify(s) { return (s || "topic").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70) || "topic"; }
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
function arr(x) { return Array.isArray(x) ? x : []; }
function strs(x) { return arr(x).map(v => String(v ?? "").trim()).filter(Boolean); }
function num(x) { const n = Number(x); return Number.isFinite(n) ? Math.max(0, Math.min(10, Math.round(n * 2) / 2)) : null; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function splitTags(s) { const seen = new Set(); return String(s || "").split(",").map(x => x.trim()).filter(x => x && !seen.has(x.toLowerCase()) && seen.add(x.toLowerCase())); }
const isoDay = iso => String(iso || "").slice(0, 10);
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3600); }
function prefGet(k) { try { return localStorage.getItem("sb:" + k); } catch { return null; } }
function prefSet(k, v) { try { localStorage.setItem("sb:" + k, v); } catch {} }

/* ---------- storage: IndexedDB on phone/web, a JSON file beside the .exe on desktop ---------- */
const DESKTOP = new URLSearchParams(location.search).has("desktop") || /SecondBrainDesktop/.test(navigator.userAgent);
const deskReady = DESKTOP ? new Promise(res => { if (window.pywebview && window.pywebview.api && window.pywebview.api.load_data) res(); else window.addEventListener("pywebviewready", () => res()); }) : Promise.resolve();
let idbP = null;
function idbOpen() { return idbP || (idbP = new Promise((res, rej) => { const r = indexedDB.open("second-brain", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => { idbP = null; rej(r.error); }; })); }
async function idbGet(k) { const d = await idbOpen(); return new Promise((res, rej) => { const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const d = await idbOpen(); return new Promise((res, rej) => { const tx = d.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbDel(k) { const d = await idbOpen(); return new Promise((res, rej) => { const tx = d.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
const Store = {
  async load() { if (DESKTOP) { await deskReady; const t = await window.pywebview.api.load_data(); return t ? JSON.parse(t) : null; } return idbGet("db"); },
  async save(db) { if (DESKTOP) { await deskReady; const ok = await window.pywebview.api.save_data(JSON.stringify(db)); if (!ok) throw new Error("save failed"); return; } return idbSet("db", db); }
};
/* Photos live outside the main record (one key / one file each) so everyday saves stay fast. */
const Photos = {
  cache: new Map(),
  async get(id) {
    if (this.cache.has(id)) return this.cache.get(id);
    let d = null;
    try { if (DESKTOP) { await deskReady; d = await window.pywebview.api.load_photo(id); } else d = await idbGet("ph:" + id); } catch (e) { console.error(e); }
    if (d) this.cache.set(id, d);
    return d;
  },
  async put(id, data) {
    this.cache.set(id, data);
    if (DESKTOP) { await deskReady; if (!await window.pywebview.api.save_photo(id, data)) throw new Error("photo save failed"); }
    else await idbSet("ph:" + id, data);
  },
  async del(id) { this.cache.delete(id); try { if (DESKTOP) { await deskReady; await window.pywebview.api.delete_photo(id); } else await idbDel("ph:" + id); } catch (e) { console.error(e); } }
};
function emptyRefs() { return { areas: {}, items: {} }; }

  const url = URL.createObjectURL(file);

    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("not an image")); i.src = url; });
    const max = 1600, w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(1, max / Math.max(w, hh));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(hh * s));
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.78);

}

let pdfjsP = null;

async function pdfThumb(data) {

    const c = document.createElement("canvas"); c.width = Math.round(v.width); c.height = Math.round(v.height);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);

async function ingestFile(f, label) {

  const data = img ? await compressImage(f) : await readDataUrl(f);
  let mime = img ? "image/jpeg" : (f.type || "application/octet-stream");
  if (!img && /\.pdf$/i.test(f.name || "")) mime = "application/pdf";
  const id = "p" + uid();
  await Photos.put(id, data);
  const m = { id, mime, name: f.name || (img ? "photo.jpg" : "file"), caption: "", label: label || (img ? "Photo" : "Document"), addedOn: today(), size: Math.round((data.length - data.indexOf(",") - 1) * 0.75) };
  if (isPdf(m)) { try { const r = await pdfThumb(data); m.thumb = r.thumb; m.pages = r.pages; } catch (e) { console.warn("pdf thumb", e); } }
  S.db.files[id] = m;

}

const NAV = []; let overlayClose = null;
const snap = () => ({ view: S.view, topicId: S.topicId, areaId: S.areaId, itemId: S.itemId });
function go(v, ids) {
  if (S.view === "edit" && v !== "edit") discardEdit();
  NAV.push(snap()); if (NAV.length > 60) NAV.shift();
  try { history.pushState({ sb: 1 }, ""); } catch {}
  S.view = v; Object.assign(S, ids || {}); S.confirm = null;

/* ---------- learn hub ---------- */
function whyNext(t) {
  if (t.score == null) return "it has no score yet";
  const bits = [];
  if (t.score < 5) bits.push("it scores " + t.score + "/10");
  const ds = daysSince(t.lastReviewed); if (ds != null && ds >= 60) bits.push("it hasn't been reviewed in " + ds + " days"); else if (dueIn(t) <= 0) bits.push("it's due for review");
  if (arr(t.openMis).length) bits.push(plural(t.openMis.length, "misconception is", "misconceptions are") + " still open");
  return bits.join(", ") || "it's your weakest topic";
}
function hubRows() {
  const q = S.q.toLowerCase().trim();
  let r = ranked();
  if (S.hubTag) r = r.filter(t => hasTag(t, S.hubTag));
  if (q) r = r.filter(t => topicText(t).includes(q));
  if (!r.length) return [h("p", { class: "muted", style: "margin-top:12px", text: "No topic matches." })];

    const ds = daysSince(t.lastReviewed); const badges = [];

    else if (t.score != null && dueIn(t) <= 0) badges.push(h("span", { class: "badge s", text: "due" }));
    return h("button", { class: "hubrow", onclick: () => go("topic", { topicId: t.id }) },

}

function searchResults(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = s => words.every(w => s.includes(w));
  const items = itemList().filter(i => hit(itemText(i)));
  const topics = topicList().filter(t => hit(topicText(t)));
  const out = [];
  if (!items.length && !topics.length) return [h("p", { class: "muted", style: "margin-top:12px", text: "Nothing found for “" + q + "”." })];
  if (items.length) {
    out.push(h("div", { class: "res-sec", text: "📌 References (" + items.length + ")" }));

function titleFromHtml(html) { const m = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html); return m ? m[1].replace(/\s+/g, " ").trim().replace(/\s*[—-]\s*notes$/i, "") : ""; }
function noteSlug(name) { return name.replace(/\.html?$/i, "").replace(/-notes$/i, ""); }
function cleanName(n) { return String(n || "").replace(/\s*\(\d+\)(?=\.[^.]+$)/, "").replace(/\s+(?=\.[^.]+$)/, ""); }
async function readFiles(files) {
  const I = S.imp; I.busy = true; render();
  const items = [];
  for (const f0 of files) {
    const name = cleanName(f0.name);
    const isJson = /\.json$/i.test(name);
    if (f0.size > (isJson ? 300e6 : 8e6)) { toast(name + " is too large."); continue; }
    let text; try { text = await f0.text(); } catch { toast("Couldn't read " + name + "."); continue; }
    if (/\.html?$/i.test(name) || /^\s*<!doctype html|^\s*<html/i.test(text)) {

    } else if (isJson) {
      let data; try { data = JSON.parse(text); } catch { toast(name + " isn't valid JSON."); continue; }
      if (data && data.app === "second-brain") items.push({ kind: "backup", fileName: name, data });
      else toast(name + " isn't a Second Brain backup.");
    } else {
      const slug = name.replace(/\.(md|markdown|txt)$/i, "");
      const { cards, refs } = parseAll(text);
      if (!cards.length && !refs.length) toast(name + " has no topic or reference card in it.");
      cards.forEach(c => items.push({ kind: "card", fileName: name, slug: cards.length === 1 ? slug : slugify(c.title), card: c }));
      refs.forEach(rc => items.push({ kind: "ref", fileName: name, rc }));

}

function buildPreview(items) {
  for (const it of items) {
    if (it.kind === "card") {
      const ex = findTopic(it.card.title, it.slug); it.existing = ex || null;
      it.older = !!(ex && ex.lastReviewed && it.card.lastReviewed && it.card.lastReviewed < ex.lastReviewed);
      const J = x => JSON.stringify(arr(x));
      it.same = !!(ex && ex.lastReviewed === it.card.lastReviewed && ex.score === it.card.score && J(ex.openMis) === J(it.card.openMis) && J(ex.gaps) === J(it.card.gaps) && J(ex.solid) === J(it.card.solid));
      it.on = !it.older && !it.same;
    } else if (it.kind === "note") {

}

  I.items.forEach((it, i) => { if (it.on && it.kind === "card") linkRelated(S.db.topics[batchIds[i]], it.card.related); });

    if (!tid && it.target.startsWith("b")) { const src = I.items[+it.target.slice(1)]; const ex = src && findTopic(src.card.title, src.slug); tid = ex && ex.id; }

/* ---------- backup ---------- */
async function backupJson() {
  const d = JSON.parse(JSON.stringify(S.db)); d.settings = { theme: d.settings.theme, autoLock: d.settings.autoLock };
  d.photos = {}; for (const id of allPhotoIds()) { const p = await Photos.get(id); if (p) d.photos[id] = p; }
  d.exportedAt = new Date().toISOString(); d.appVersion = APP_VERSION; return JSON.stringify(d);
}
async function mergeBackup(data) {
  let n = 0;
  for (const bt of Object.values(data.topics || {})) {
    if (!bt || !bt.title) continue;
    const ex = S.db.topics[bt.id] || findTopic(bt.title, bt.fileSlug);
    if (!ex) { const id = bt.id && !S.db.topics[bt.id] ? bt.id : slugify(bt.title) + "-" + uid().slice(-4); S.db.topics[id] = Object.assign({}, bt, { id }); n++; continue; }
    const newer = String(bt.lastReviewed || "") > String(ex.lastReviewed || "") || (bt.lastReviewed === ex.lastReviewed && String(bt.updatedAt || "") > String(ex.updatedAt || ""));
    const base = newer ? Object.assign({}, bt, { id: ex.id }) : ex;
    base.fixedMis = unionBy(base.fixedMis, newer ? ex.fixedMis : bt.fixedMis, fixKey);
    base.sessionNotes = unionBy(base.sessionNotes, newer ? ex.sessionNotes : bt.sessionNotes, noteKey);
    base.history = unionBy(arr(ex.history), arr(bt.history), x => x.date + "|" + x.score).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    base.related = [...new Set([...arr(ex.related), ...arr(bt.related)])];
    base.attachments = [...new Set([...arr(ex.attachments), ...arr(bt.attachments)])];
    S.db.topics[ex.id] = base; n++;
  }
  for (const bn of Object.values(data.notes || {})) {
    if (!bn || !bn.html) continue;
    if (Object.values(S.db.notes).some(n2 => n2.fileName === bn.fileName && n2.html === bn.html)) continue;
    const tid = S.db.topics[bn.topicId] ? bn.topicId : (() => { const bt = (data.topics || {})[bn.topicId]; const m = bt && findTopic(bt.title, bt.fileSlug); return m && m.id; })();
    if (!tid) continue;
    const id = bn.id && !S.db.notes[bn.id] ? bn.id : uid();
    S.db.notes[id] = Object.assign({}, bn, { id, topicId: tid });
  }
  // references
  const br = data.refs || {}; const amap = {};
  for (const ba of Object.values(br.areas || {})) {
    if (!ba || !ba.name) continue;
    const ex = R().areas[ba.id] || findArea(ba.name);
    if (ex) { amap[ba.id] = ex.id; if (String(ba.updatedAt || "") > String(ex.updatedAt || "") && !(findArea(ba.name) && findArea(ba.name).id !== ex.id)) { ex.name = ba.name; ex.icon = ba.icon; ex.updatedAt = ba.updatedAt; } }
    else { const id = ba.id || "a" + uid(); R().areas[id] = Object.assign({}, ba, { id }); amap[ba.id] = id; }
  }
  const photos = data.photos || {};
  for (const bi of Object.values(br.items || {})) {
    if (!bi || !bi.title || !KINDS[bi.kind]) continue;
    const areaId = amap[bi.areaId] || bi.areaId; if (!R().areas[areaId]) continue;
    const ex = R().items[bi.id];
    if (!ex) { R().items[bi.id] = Object.assign({}, bi, { areaId }); n++; }
    else if (String(bi.updatedAt || "") > String(ex.updatedAt || "")) { const keep = arr(ex.photos).filter(p => !arr(bi.photos).includes(p)); R().items[bi.id] = Object.assign({}, bi, { areaId, photos: [...arr(bi.photos), ...keep] }); n++; }
  }
  for (const [id, m] of Object.entries(data.files || {})) { if (m && !S.db.files[id]) S.db.files[id] = m; }
  for (const [id, d] of Object.entries(photos)) { if (typeof d === "string" && d.startsWith("data:") && !(await Photos.get(id))) await Photos.put(id, d); }
  return n;
}

async function hashPin(pin) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("sb:" + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch { let x = 5381; for (const c of "sb:" + pin) x = ((x << 5) + x + c.charCodeAt(0)) | 0; return "d" + (x >>> 0).toString(16); }
}

    box.append(h("label", { class: "f", style: "margin-top:12px" }, "Lock when I leave the app",
      h("select", { onchange: e => { st.autoLock = +e.target.value; persist(); toast("Saved."); } }, opts.map(([v, l]) => h("option", { value: String(v), text: l, selected: (st.autoLock ?? 60) === v ? true : null })))));
    box.append(h("div", { style: "margin-top:8px" }, h("button", { class: "btn link", text: "Turn PIN off", onclick: () => { st.pinHash = null; persist(); render(); toast("PIN turned off."); } })));
  }

  box.append(h("h2", { text: "Storage" }));
  const nNotes = Object.keys(S.db.notes).length;
  const size = new Blob([JSON.stringify(S.db)]).size;
  box.append(h("p", { class: "small", text: plural(topicList().length, "topic", "topics") + ", " + plural(nNotes, "notes file", "notes files") + ", " + plural(areaList().length, "area", "areas") + ", " + plural(itemList().length, "reference item", "reference items") + ", " + plural(allPhotoIds().length, "photo or file", "photos and files") + ". Text data about " + Math.max(1, Math.round(size / 1024)) + " KB. " + (DESKTOP ? "Saved in the data folder next to SecondBrain.exe." : "Saved in this browser on this device.") }));
  box.append(confirmBtn("wipe", "Delete everything", "Tap again. This can't be undone.", async () => {
    for (const p of allPhotoIds()) await dropFile(p);
    const keep = { theme: S.db.settings.theme }; S.db = emptyDb(); S.db.settings.theme = keep.theme; persist(); go("learn"); toast("All data deleted.");
  }));
  box.append(h("p", { class: "muted small", style: "margin-top:20px", text: "Second Brain " + APP_VERSION + (DESKTOP ? " · desktop" : "") }));
  return box;
}
function applyTheme() { const th = S.db.settings.theme === "light" ? "light" : "dark"; document.documentElement.dataset.theme = th; const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = th === "dark" ? "#0E1B1D" : "#E9EEED"; }

/* ---------- lock ---------- */
function showLock() {
  if (S.locked) return;
  S.locked = true; let pin = "";
  const inp = h("input", { type: "password", inputmode: "numeric", autocomplete: "off", "aria-label": "PIN", oninput: e => pin = e.target.value.trim(), onkeydown: e => { if (e.key === "Enter") tryPin(); } });
  const tryPin = async () => { if (await hashPin(pin) === S.db.settings.pinHash) { S.locked = false; $("#lockbox").replaceChildren(); } else { inp.value = ""; pin = ""; toast("Wrong PIN."); } };
  $("#lockbox").replaceChildren(h("div", { class: "lock" }, h("div", { class: "box" }, h("div", { style: "font-size:40px", text: "🔒" }), h("h1", { text: "Second Brain" }), h("p", { class: "muted", text: "Enter your PIN" }), inp, h("button", { class: "btn primary", text: "Unlock", onclick: tryPin }))));
  setTimeout(() => inp.focus(), 50);
}
let taps = [], hiddenAt = 0, pickerOpen = 0;
$("#brand").addEventListener("click", () => {
  const now = Date.now(); taps = taps.filter(x => now - x < 700); taps.push(now);
  if (taps.length >= 3) { taps = []; if (S.db.settings.pinHash) { if (saveTimer) flush(); showLock(); } else toast("Set a PIN under More first."); }
});
$("#searchBtn").addEventListener("click", () => { if (S.view !== "search") go("search"); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); if (saveTimer) flush(); return; }
  const st = S.db.settings, al = st.autoLock ?? 60;
  const picking = pickerOpen && Date.now() - pickerOpen < 5 * 60 * 1000; pickerOpen = 0;
  if (st.pinHash && !S.locked && !picking && al >= 0 && hiddenAt && Date.now() - hiddenAt >= al * 1000) showLock();
});

/* ---------- boot ---------- */
async function init() {
  render();
  try {
    const d = await Store.load();
    if (d && d.topics) {
      S.db = Object.assign(emptyDb(), d, { settings: Object.assign(emptyDb().settings, d.settings || {}) });
      if (!S.db.refs || typeof S.db.refs !== "object") S.db.refs = emptyRefs();
      S.db.refs.areas = S.db.refs.areas || {}; S.db.refs.items = S.db.refs.items || {};
      if (!S.db.files || typeof S.db.files !== "object") S.db.files = {};
      S.db.schema = 3;
    }
    setStatus(DESKTOP ? "Desktop" : "Offline-ready");
  } catch (e) { console.error(e); setStatus("Storage error"); toast("Couldn't open storage. Nothing will be saved."); }
  applyTheme();
  const t = prefGet("tab"); if (t && ["learn", "refs", "report", "import", "more"].includes(t)) S.view = t;
  try { history.replaceState({ sb: 0 }, ""); } catch {}
  render();
  if (S.db.settings.pinHash) showLock();
  if (!DESKTOP) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
init();
</script>
</body>
</html>
